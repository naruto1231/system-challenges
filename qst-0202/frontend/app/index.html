<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Input Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .wrapper {
            background-color: #fff;
            max-width: 480px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-section {
            margin-bottom: 30px;
        }
        label {
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #072AC8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #072AC8;
        }
        .result {
            background-color: #fff;
            max-width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
    <script src="./app.js"></script>
</head>
<body>
    <div class="wrapper">
        <div class="form-section">
            <h2>郵便番号から住所を検索する</h2>
            <label for="input-zip">郵便番号を入力してください。(半角数字を指定、ハイフンなし)</label>
            <input type="text" id="input-zip" name="input-zip">
            <button onclick="searchByZipCode()">検索</button>
        </div>

        <div class="form-section">
            <h2>住所から郵便番号を検索する</h2>
            <label for="input-address">住所を入力してください(漢字または全角カタカナを指定)</label>
            <input type="text" id="input-address" name="input-address">
            <button onclick="searchByAddress()">検索</button>
        </div>

        <div>
            <h2>検索結果</h2>
            <div id="result"></div>
        </div>
    </div>
</body>
</html>
